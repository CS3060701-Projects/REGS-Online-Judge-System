openapi: 3.0.3
info:
  title: REGS Online Judge API
  description: CS3060701 期末專案 - Remote Evaluation and Grading System
  version: 1.0.0
servers:
  - url: http://localhost:8081/api
    description: Local development server
tags:
  - name: Users
  - name: Problems
  - name: Submissions
  - name: Statistics
  - name: Admin
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [Guest, User, Admin]
        created_at:
          type: string
          format: date-time
    Problem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        time_limit:
          type: integer
        memory_limit:
          type: integer
        is_visible:
          type: boolean
    Submission:
      type: object
      properties:
        operatorId:
          type: string
        problem_id:
          type: string
        status:
          type: string
          enum: [Pending, Compiling, Judging, AC, WA, CE, SE, RE, TLE]
        run_time:
          type: integer
        run_memory:
          type: integer
        created_at:
          type: string
          format: date-time
paths:
  /users/register:
    post:
      tags: [Users]
      summary: 註冊新使用者帳號
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: 註冊成功
        '409':
          description: 使用者名稱已被註冊
  /users/login:
    post:
      tags: [Users]
      summary: 登入並取得 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: 登入成功，回傳 token
  /users/logout:
    post:
      tags: [Users]
      summary: 登出
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 登出成功
  /users/me:
    get:
      tags: [Users]
      summary: 取得目前使用者資料
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{user_id}/submissions:
    get:
      tags: [Users]
      summary: 取得指定使用者的提交紀錄
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /problems:
    get:
      tags: [Problems]
      summary: 取得題目列表
      responses:
        '200':
          description: OK
    put:
      tags: [Admin]
      summary: 建立或更新題目（含測資）
      description: |
        (Admin only) 使用 multipart/form-data 一次完成建立題目與上傳測資。
        若題目 ID 已存在（含軟刪除），則更新並還原；否則新建。
        time_limit 與 memory_limit 會自動從 zip 內的 settings.yaml 讀取（limits.totalTime / limits.memory）。
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id, title, file]
              properties:
                id:
                  type: string
                  description: 題目 ID
                title:
                  type: string
                  description: 題目標題
                description:
                  type: string
                  description: 題目描述（Markdown）
                is_visible:
                  type: boolean
                  description: 是否公開（預設 true）
                  default: true
                file:
                  type: string
                  format: binary
                  description: 測資壓縮檔（.zip），需包含 settings.yaml
      responses:
        '200':
          description: 題目建立/更新成功，測資已上傳
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  problem:
                    $ref: '#/components/schemas/Problem'
        '400':
          description: 缺少必要欄位或 zip 檔案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 伺服器內部錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /problems/{problem_id}:
    get:
      tags: [Problems]
      summary: 取得單一題目描述
      parameters:
        - name: problem_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    delete:
      tags: [Admin]
      summary: 刪除題目
      security: [{BearerAuth: []}]
      parameters:
        - name: problem_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 刪除成功
  /problems/{problem_id}/testcases:
    get:
      tags: [Admin]
      summary: 下載題目測資壓縮檔
      security: [{BearerAuth: []}]
      parameters:
        - name: problem_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ZIP 檔案
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /submissions:
    post:
      tags: [Submissions]
      summary: 提交程式碼進行評測
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [problem_id, file]
              properties:
                problem_id:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 立即回傳 operatorId
    get:
      tags: [Submissions]
      summary: 查詢個人提交紀錄
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: OK
  /submissions/{operatorId}:
    get:
      tags: [Submissions]
      summary: 取得單一提交評測結果
      security: [{BearerAuth: []}]
      parameters:
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
  /submissions/{operatorId}/source:
    get:
      tags: [Submissions]
      summary: 下載提交原始專案 zip
      security: [{BearerAuth: []}]
      parameters:
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ZIP 檔案
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /stats/problems/{problem_id}:
    get:
      tags: [Statistics]
      summary: 題目統計
      parameters:
        - name: problem_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /stats/users/{user_id}:
    get:
      tags: [Statistics]
      summary: 使用者統計
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
